[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmfgpu"
version = "0.1"
description = ""
authors = [
    {name = "Shengyu Kang", email = "kshy0204@whu.edu.cn"}
]
dependencies = [
    "hydroforge>=0.1.0",
    "netCDF4",
    "scipy",
    "numba",
    "pydantic",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cmfgpu*"]

[tool.setuptools.package-data]
"cmfgpu.phys.cuda" = ["*.cu", "*.cuh"]
"cmfgpu.phys.metal" = ["*.metal"]

[project.optional-dependencies]
dev = ["ipykernel", "matplotlib", "ipympl", "pandas", "meson", "ninja"]
